name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check resources without publishing"
        required: false
        type: boolean
        default: false
      provision:
        description: "Create missing D1, R2, Queue, and Vectorize resources"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flaremo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'zuoban/FlareMo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.config.outputs.public_url }}
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FLAREMO_BOOTSTRAP_SECRET: ${{ secrets.FLAREMO_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET FLAREMO_BOOTSTRAP_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret ${name}."
              exit 1
            fi
          done

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write wrangler.jsonc
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          FLAREMO_D1_DATABASE_ID: ${{ secrets.FLAREMO_D1_DATABASE_ID }}
          FLAREMO_PUBLIC_URL: ${{ vars.FLAREMO_PUBLIC_URL || secrets.FLAREMO_PUBLIC_URL }}
          FLAREMO_DEPLOY_REPOSITORY: ${{ github.repository }}
        run: node ./scripts/write-wrangler-config.mjs

      - name: Provision / verify Cloudflare resources
        env:
          PROVISION: ${{ github.event_name == 'push' || inputs.provision }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${PROVISION}" == "true" && "${DRY_RUN}" != "true" ]]; then
            pnpm provision:remote
          else
            pnpm provision:remote -- --check
          fi

      - name: Read production URL
        id: config
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { parse } from "jsonc-parser";
          const config = parse(readFileSync("wrangler.jsonc", "utf8"));
          appendFileSync(process.env.GITHUB_OUTPUT, `public_url=${config.vars.FLAREMO_PUBLIC_URL}\n`);
          NODE

      - name: Deploy
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            pnpm deploy:dry-run
          else
            pnpm deploy
          fi

      - name: Sync Worker secrets
        if: ${{ inputs.dry_run != true }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FLAREMO_BOOTSTRAP_SECRET: ${{ secrets.FLAREMO_BOOTSTRAP_SECRET }}
        run: pnpm secrets:sync

      - name: Smoke check deployed site
        if: ${{ inputs.dry_run != true }}
        run: pnpm smoke:check

      - name: Write deployment summary
        env:
          PUBLIC_URL: ${{ steps.config.outputs.public_url }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### FlareMo deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Site: ${PUBLIC_URL}"
            echo "- First-time setup: ${PUBLIC_URL}/setup"
            echo "- Dry run: ${DRY_RUN:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"
